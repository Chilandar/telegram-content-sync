name: Telegram to Rubika Bridge

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

jobs:
  run-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bridge script
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_SESSION: ${{ secrets.TG_SESSION }}
          RUBIKA_SESSION_B64: ${{ secrets.RUBIKA_SESSION_B64 }}
          CHANNEL_MAPPINGS: ${{ secrets.CHANNEL_MAPPINGS }}
        run: python bridge.py

      - name: Commit updated tracking files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          for f in last_ids.json fail_counts.json last_run.txt; do
            if [ -f "$f" ]; then
              git add "$f"
            fi
          done
          git diff --staged --quiet || git commit -m "Update tracking files"
          git push
